<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in · Kanyadet School Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="login-shell">

  <!-- Left: brand visual -->
  <div class="login-visual" aria-hidden="true">
    <div class="brand">
      <div class="brand-mark" style="background:#fff;color:#14161a;">KS</div>
      <div>
        <div class="brand-name">Kanyadet School</div>
        <span class="brand-sub">Admin Portal</span>
      </div>
    </div>
    <p class="quote">
      "One sign-in, every term's results, attendance, timetables,
      and staff records — in one place."
    </p>
    <div style="font-size:12px;color:rgba(255,255,255,.45);">
      © <span id="year-visual"></span> Kanyadet School
    </div>
  </div>

  <!-- Right: sign-in form -->
  <div class="login-form-side">
    <div class="login-card">
      <div class="brand-mark" style="width:36px;height:36px;background:#14161a;color:#fff;">KS</div>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to the admin portal to manage results, attendance and staff.</p>

      <!-- Google One Tap / rendered button target -->
      <div id="gsi-button-container"></div>

      <div class="divider">or</div>

      <form id="email-login-form" novalidate>
        <div class="field">
          <label for="email">Work email</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>

      <p id="login-status" class="login-status" role="status"></p>
      <p style="font-size:12.5px;color:var(--ink-soft);text-align:center;margin-top:18px;">
        Parent? Sign in above, then <a href="./parent-portal.html" style="text-decoration:underline;">register your account</a>.
      </p>
    </div>
  </div>

</div>

<script type="module">
  import {
    GoogleAuthProvider,
    signInWithCredential,
    signInWithEmailAndPassword,
    onAuthStateChanged,
  } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

  import { GOOGLE_CLIENT_ID } from './js/config.js';
  import { auth } from './js/firebase-init.js';
  import { GoogleOneTap, SessionManager, guardPage } from './js/google-one-tap.js';
  import { resolveUserRole, landingPageFor } from './js/roles.js';

  document.getElementById('year-visual').textContent = new Date().getFullYear();

  const statusEl = document.getElementById('login-status');
  function setStatus(msg, kind) {
    statusEl.textContent = msg || '';
    statusEl.className = 'login-status' + (kind ? ` is-${kind}` : '');
  }

  // If a session already exists, skip straight to the role-appropriate page.
  guardPage({
    onAuthed: (user) => { window.location.href = landingPageFor(user.role); },
    onUnauthed: () => { /* stay on this page */ },
  });

  async function completeSignIn(firebaseUser, profileHint) {
    setStatus('Checking your access…');
    const roleInfo = await resolveUserRole(firebaseUser);
    const record = {
      uid: firebaseUser.uid,
      email: firebaseUser.email,
      name: firebaseUser.displayName || (profileHint && profileHint.name) || '',
      picture: firebaseUser.photoURL || (profileHint && profileHint.picture) || '',
      role: roleInfo.role,
      isAdmin: roleInfo.isAdmin,
      isAdvancedAdmin: roleInfo.isAdvancedAdmin,
      isTeacher: roleInfo.isTeacher,
    };
    new SessionManager().start(record);
    setStatus('Signed in — redirecting…', 'ok');
    window.location.href = landingPageFor(roleInfo.role);
  }

  // --- Google One Tap / button ---
  const oneTap = new GoogleOneTap({
    clientId: GOOGLE_CLIENT_ID,
    buttonContainer: '#gsi-button-container',
    deferAutoPromptUntilSignal: true, // we confirm session state via onAuthStateChanged below
    debug: false,
    onSuccess: async (profile) => {
      try {
        setStatus('Signing in…');
        const credential = GoogleAuthProvider.credential(profile.raw.credential);
        const result = await signInWithCredential(auth, credential);
        await completeSignIn(result.user, profile);
      } catch (err) {
        console.error(err);
        setStatus('Google sign-in failed. Try again or use your email.', 'error');
      }
    },
    onUnavailable: () => {
      setStatus('Google sign-in is unavailable right now — use your email below.', 'error');
    },
    onError: (err) => {
      console.error(err);
      setStatus('Something went wrong with Google sign-in.', 'error');
    },
  });
  oneTap.init();

  onAuthStateChanged(auth, (user) => {
    if (user) { oneTap.notifySignedIn(); }
    else { oneTap.notifySignedOut(); }
  });

  // --- Email/password fallback ---
  document.getElementById('email-login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    setStatus('Signing in…');
    try {
      const result = await signInWithEmailAndPassword(auth, email, password);
      await completeSignIn(result.user);
    } catch (err) {
      console.error(err);
      setStatus('Could not sign in. Check your email and password.', 'error');
    }
  });
</script>

</body>
</html>
