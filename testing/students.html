<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Students · Kanyadet School Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
<style>
  .students-shell { max-width: 1080px; margin: 0 auto; padding: 24px 20px 60px; display: flex; flex-direction: column; gap: 16px; }
  .students-topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .students-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .students-controls input, .students-controls select {
    border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
    padding: 8px 12px; font-size: 13px; font-family: inherit; background: #fff;
  }
  .students-controls input { min-width: 220px; }
  table.students-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .students-table th {
    text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-soft); padding: 10px 12px; border-bottom: 1px solid var(--line-strong);
  }
  .students-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .students-table tr:hover td { background: rgba(20,22,26,0.02); }
  .gender-chip { font-size: 10.5px; border-radius: 999px; padding: 2px 8px; font-weight: 600; }
  .gender-Female { background: #f3e4ea; color: #8a3a5c; }
  .gender-Male { background: #e2e8f0; color: #34506b; }
  .gender-Unspecified { background: var(--line); color: var(--ink-soft); }
  .back-link { font-size: 12.5px; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 4px; margin-bottom: 2px; }
</style>
</head>
<body>

<div class="students-shell">
  <a class="back-link" href="./dashboard.html">← Back to dashboard</a>
  <div class="students-topbar">
    <div>
      <h1 style="font-family:var(--font-display);font-size:24px;margin:0;">Students</h1>
      <p id="students-summary" style="font-size:12.5px;color:var(--ink-soft);margin:2px 0 0;">Loading roster…</p>
    </div>
    <div class="students-controls">
      <input type="search" id="student-search" placeholder="Search by name or UPI…" />
      <select id="grade-filter"><option value="">All grades</option></select>
      <select id="status-filter">
        <option value="">All statuses</option>
        <option value="active">Active only</option>
        <option value="other">Non-active only</option>
      </select>
      <button class="btn btn-ghost" id="refresh-roster-btn" type="button">Refresh roster</button>
    </div>
  </div>

  <div class="card" style="padding:0;overflow-x:auto;">
    <table class="students-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Grade</th>
          <th>Gender</th>
          <th>UPI / Assessment No</th>
          <th>Admission date</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="students-tbody">
        <tr><td colspan="6"><p class="empty-note">Loading…</p></td></tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
  import { protectPage } from './js/page-guard.js';
  import { landingPageFor } from './js/roles.js';
  import { fetchAllStudents, isBlank, invalidateStudentsCache } from './js/students-data.js';

  const { ok, profile } = protectPage();
  let allStudents = [];

  if (ok) {
    if (!['admin', 'advancedAdmin', 'teacher'].includes(profile.role)) {
      window.location.href = landingPageFor(profile.role);
    } else {
      init();
    }
  }
  // if !ok, protectPage() already redirected to login — render nothing further

  async function init() {
    allStudents = await fetchAllStudents();
    populateGradeFilter(allStudents);
    render();

    document.getElementById('student-search').addEventListener('input', render);
    document.getElementById('grade-filter').addEventListener('change', render);
    document.getElementById('status-filter').addEventListener('change', render);
    document.getElementById('refresh-roster-btn').addEventListener('click', async (e) => {
      e.target.disabled = true;
      e.target.textContent = 'Refreshing…';
      invalidateStudentsCache();
      allStudents = await fetchAllStudents({ forceRefresh: true });
      document.getElementById('grade-filter').innerHTML = '<option value="">All grades</option>';
      populateGradeFilter(allStudents);
      render();
      e.target.disabled = false;
      e.target.textContent = 'Refresh roster';
    });
  }

  function populateGradeFilter(students) {
    const select = document.getElementById('grade-filter');
    const grades = [...new Set(students.map(s => isBlank(s.Grade) ? 'Unassigned' : s.Grade))].sort();
    grades.forEach((g) => {
      const opt = document.createElement('option');
      opt.value = g;
      opt.textContent = g;
      select.appendChild(opt);
    });
  }

  function render() {
    const search = document.getElementById('student-search').value.trim().toLowerCase();
    const gradeFilter = document.getElementById('grade-filter').value;
    const statusFilter = document.getElementById('status-filter').value;

    const filtered = allStudents.filter((s) => {
      const name = (s['Official Student Name'] || '').toLowerCase();
      const upi = (s.UPI || '').toLowerCase();
      const assessNo = (s['Assessment No'] || '').toLowerCase();
      if (search && !name.includes(search) && !upi.includes(search) && !assessNo.includes(search)) return false;

      const grade = isBlank(s.Grade) ? 'Unassigned' : s.Grade;
      if (gradeFilter && grade !== gradeFilter) return false;

      const isActive = isBlank(s.Status) || String(s.Status).trim().toLowerCase() === 'active';
      if (statusFilter === 'active' && !isActive) return false;
      if (statusFilter === 'other' && isActive) return false;

      return true;
    });

    document.getElementById('students-summary').textContent =
      `${filtered.length.toLocaleString()} of ${allStudents.length.toLocaleString()} students`;

    const tbody = document.getElementById('students-tbody');
    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6"><p class="empty-note">No students match.</p></td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map((s) => {
      const gender = isBlank(s.Gender) ? 'Unspecified' : s.Gender;
      const status = isBlank(s.Status) ? 'Active' : s.Status;
      return `
        <tr>
          <td>${escapeHtml(titleCase(s['Official Student Name']))}</td>
          <td>${escapeHtml(isBlank(s.Grade) ? '—' : s.Grade)}</td>
          <td><span class="gender-chip gender-${escapeHtml(gender)}">${escapeHtml(gender)}</span></td>
          <td>${escapeHtml(s.UPI || s['Assessment No'] || '—')}</td>
          <td>${escapeHtml(isBlank(s.DateOfAdmission) ? '—' : s.DateOfAdmission)}</td>
          <td>${escapeHtml(status)}</td>
        </tr>
      `;
    }).join('');
  }

  function titleCase(s) {
    if (!s) return '—';
    return String(s).toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script>

</body>
</html>
