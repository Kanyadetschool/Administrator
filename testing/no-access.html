<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>No access · Kanyadet School Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="login-form-side" style="min-height:100vh;">
  <div class="login-card" style="text-align:center;">
    <div class="brand-mark" style="width:36px;height:36px;background:#14161a;color:#fff;margin:0 auto;">KS</div>
    <h1>We couldn't place your account</h1>
    <p class="sub">
      Your sign-in worked, but we couldn't match it to an admin, teacher, or
      parent record. If you're a parent, try registering below. If you're
      staff, ask an admin to add you to the system.
    </p>
    <a class="btn btn-primary btn-block" href="./parent-portal.html" style="margin-bottom:10px;">Register as a parent</a>
    <a class="btn btn-ghost btn-block" href="#" id="sign-out-link">Sign out and try a different account</a>
  </div>
</div>

<script type="module">
  import { signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { auth } from './js/firebase-init.js';
  import { SessionManager } from './js/google-one-tap.js';

  document.getElementById('sign-out-link').addEventListener('click', async (e) => {
    e.preventDefault();
    SessionManager.clear();
    try { await signOut(auth); } catch (err) { console.error(err); }
    window.location.href = './login.html';
  });
</script>
</body>
</html>
