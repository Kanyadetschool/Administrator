<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanyadet School — Access Denied</title>
  <link rel="icon" type="image/x-icon" href="./images/logo.png">
  <link rel="manifest" href="./manifest.json">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./PWA/pwa.css">
  <script src="./PWA/pwa.js"></script>

  <style>
    :root {
      --blue:#2980b9; --blue-dk:#1a5276; --blue-lt:#5dade2; --blue-glow:rgba(41,128,185,.35);
      --orange:#e67e22; --orange-dk:#d35400; --gold:#f39c12;
      --green:#27ae60; --green-dk:#1d8a4e; --red:#e74c3c; --red-dk:#c0392b;
      --purple:#8e44ad; --teal:#16a085;
      --brand-1:#0f4c81; --brand-2:#3f8fc5; --brand-3:#ffb84d;
      --radius-xl:24px; --radius-lg:18px; --radius-md:12px; --radius-sm:8px;
      --transition:all .25s cubic-bezier(.4,0,.2,1);
    }
    [data-theme="dark"] {
      --bg:#090f1a; --bg2:#0c1525; --surface:#111d2e; --surface2:#162438;
      --surface3:#1c2e44; --border:rgba(41,128,185,.18); --border-strong:rgba(41,128,185,.4);
      --text:#ddeeff; --text2:#7aaec9; --text3:#4a7a9b;
      --card-shadow:0 8px 32px rgba(0,0,0,.4);
    }
    [data-theme="light"] {
      --bg:linear-gradient(135deg,#eef0f2 0%,#f4f0e6 45%,#fbecc3 100%);
      --bg2:#f7edd0; --surface:#ffffff; --surface2:#fdfaf2;
      --surface3:#f8eed6; --border:rgba(211,164,55,.2); --border-strong:rgba(211,164,55,.45);
      --text:#0c1e33; --text2:#5a5342; --text3:#a89b7a;
      --card-shadow:0 4px 20px rgba(211,164,55,.14);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s;display:flex;align-items:center;justify-content:center;padding:20px}
    body::before{
      content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
      background:radial-gradient(circle at 10% 10%, rgba(231,76,60,.14), transparent 26%),
        radial-gradient(circle at 88% 92%, rgba(230,126,34,.16), transparent 24%),
        linear-gradient(120deg, rgba(255,255,255,.08), transparent 60%);
    }
    a{color:inherit;text-decoration:none}

    .card{position:relative;z-index:1;width:100%;max-width:420px;background:var(--surface);border-radius:28px;padding:2.6rem 2.2rem 2.2rem;box-shadow:0 30px 90px rgba(10,30,60,.28),0 0 0 1px rgba(41,128,185,.07);border:1px solid var(--border);text-align:center;animation:fadeUp .5s cubic-bezier(.34,1.56,.64,1)}
    @keyframes fadeUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
    .icon{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--red),var(--red-dk));display:grid;place-items:center;font-size:30px;margin:0 auto 1.2rem;box-shadow:0 10px 26px rgba(231,76,60,.35)}
    h1{font-size:1.4rem;font-weight:900;letter-spacing:-.01em;color:var(--text);margin-bottom:.5rem}
    .sub{font-size:.88rem;color:var(--text2);font-weight:500;line-height:1.55;margin-bottom:.4rem}
    .account{font-size:.78rem;color:var(--text3);font-weight:600;margin-bottom:1.6rem;word-break:break-all}
    .btn{width:100%;padding:.9rem 1.5rem;border:none;border-radius:14px;font-family:inherit;font-size:.88rem;font-weight:800;cursor:pointer;transition:var(--transition);margin-bottom:.7rem;display:flex;align-items:center;justify-content:center;gap:.55rem}
    .btn-primary{background:linear-gradient(135deg,var(--blue),var(--blue-dk));color:#fff;box-shadow:0 12px 28px rgba(20,40,70,.3)}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(20,40,70,.4)}
    .links{display:flex;flex-direction:column;gap:.4rem;font-size:.79rem;color:var(--text2);font-weight:600;margin-top:.6rem}
    .links a{color:var(--blue-lt)}
    .links a:hover{text-decoration:underline}
    .divider{height:1px;background:var(--border);margin:1.1rem 0}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔒</div>
    <h1>Access Denied</h1>
    <p class="sub">This area requires Advanced Admin or Librarian privileges on your account. If you believe this is a mistake, contact your system administrator to have access granted.</p>
    <p class="account" id="account-line"></p>
    <button class="btn btn-primary" id="btn-switch">Sign in with a different account</button>
    <div class="divider"></div>
    <div class="links">
      <a href="https://kanyadet-school-parents.web.app/">Parents Portal</a>
      <a href="https://kanyadet-school-portal.web.app">Teachers Portal</a>
      <a href="https://kanyadet-school-admin.web.app">Admin Portal</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { FIREBASE_CONFIG } from './js/config.js';

    const app = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      const line = document.getElementById('account-line');
      if (user) line.textContent = `Signed in as ${user.email || user.uid}`;
    });

    document.getElementById('btn-switch').addEventListener('click', async () => {
      try { await signOut(auth); } catch (e) { console.error(e); }
      window.location.href = '/login.html';
    });
  </script>
</body>
</html>
