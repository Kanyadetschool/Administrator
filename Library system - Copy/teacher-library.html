<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kanyadet School — Teachers Library</title>
<link rel="icon" type="image/x-icon" href="./images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<!-- Firebase (compat SDK, matches index.html / student-portal.html) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
  :root {
    --blue:#2980b9; --blue-dk:#1a5276; --blue-lt:#5dade2; --blue-glow:rgba(41,128,185,.35);
    --green:#27ae60; --green-dk:#1d8a4e; --red:#e74c3c;
    --radius-lg:18px; --radius-md:12px;
    --transition:all .2s ease;
  }
  [data-theme="light"] {
    --bg:linear-gradient(135deg,#eef0f2 0%,#f4f0e6 45%,#fbecc3 100%);
    --surface:#ffffff; --surface2:#fdfaf2;
    --border:rgba(211,164,55,.2); --text:#0c1e33; --text2:#5a5342; --text3:#a89b7a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  body.auth-pending > *:not(script):not(style){visibility:hidden}

  header{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.6rem;background:var(--surface);border-bottom:1px solid var(--border)}
  header h1{font-size:1.05rem;font-weight:800}
  header h1 span{color:var(--blue)}
  #logoutBtn{border:none;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:.5rem 1rem;font-family:inherit;font-weight:700;font-size:.8rem;cursor:pointer;color:var(--text2)}
  #logoutBtn:hover{background:#fdecea;color:var(--red)}

  main{max-width:920px;margin:0 auto;padding:1.6rem}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.6rem;margin-bottom:1.4rem;box-shadow:0 4px 20px rgba(211,164,55,.08)}
  .card h2{font-size:1rem;font-weight:800;margin-bottom:1rem}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  label{display:block;font-size:.72rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.03em;margin-bottom:.35rem}
  select,input{width:100%;padding:.7rem .85rem;border-radius:var(--radius-md);border:1.5px solid var(--border);background:var(--surface2);font-family:inherit;font-size:.85rem;color:var(--text)}
  select:disabled{opacity:.5}
  .field{margin-bottom:.9rem}
  .btn{border:none;border-radius:var(--radius-md);padding:.85rem 1.4rem;font-family:inherit;font-size:.85rem;font-weight:800;cursor:pointer;transition:var(--transition)}
  .btn-primary{background:linear-gradient(135deg,var(--blue),var(--blue-dk));color:#fff}
  .btn-primary:hover{transform:translateY(-1px)}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .btn-return{background:var(--surface2);border:1px solid var(--border);color:var(--green-dk);padding:.45rem .8rem;font-size:.75rem}
  .btn-return:hover{background:#eafaf0}

  .msg{border-radius:10px;padding:.7rem 1rem;font-size:.8rem;font-weight:600;margin-bottom:1rem;display:none}
  .msg.ok{display:block;background:rgba(39,174,96,.1);color:var(--green-dk);border:1px solid rgba(39,174,96,.25)}
  .msg.err{display:block;background:rgba(231,76,60,.1);color:var(--red);border:1px solid rgba(231,76,60,.25)}

  table{width:100%;border-collapse:collapse;font-size:.83rem}
  th{text-align:left;color:var(--text3);font-size:.7rem;text-transform:uppercase;letter-spacing:.03em;padding:.5rem .4rem;border-bottom:1px solid var(--border)}
  td{padding:.65rem .4rem;border-bottom:1px solid var(--border)}
  .pill{display:inline-block;padding:.2rem .6rem;border-radius:99px;font-size:.68rem;font-weight:700}
  .pill-active{background:rgba(41,128,185,.12);color:var(--blue-dk)}
  .pill-overdue{background:rgba(231,76,60,.12);color:var(--red)}
  .empty{text-align:center;color:var(--text3);font-size:.82rem;padding:1.5rem 0}
</style>
</head>
<body class="auth-pending">

<header>
  <h1>Kanyadet <span>Teachers Library</span></h1>
  <button id="logoutBtn">Log out</button>
</header>

<main>
  <div class="msg" id="msg"></div>

  <!-- Issue a book. This is the only write action available on this page
       besides marking a return — there is no delete affordance anywhere,
       by design: teachers can issue and the librarian's tool (index.html)
       remains the only place with delete/edit power over the catalog. -->
  <div class="card">
    <h2>Issue a Book</h2>
    <div class="grid">
      <div class="field">
        <label for="gradeSelect">Grade</label>
        <select id="gradeSelect"><option value="">Select grade</option></select>
      </div>
      <div class="field">
        <label for="studentSelect">Student</label>
        <select id="studentSelect" disabled><option value="">Select grade first</option></select>
      </div>
      <div class="field">
        <label for="bookSelect">Book (available only)</label>
        <select id="bookSelect"><option value="">Select book</option></select>
      </div>
      <div class="field">
        <label for="dueDate">Due date</label>
        <input type="date" id="dueDate">
      </div>
    </div>
    <button class="btn btn-primary" id="issueBtn">Issue Book</button>
  </div>

  <!-- Read-only list of what THIS teacher has issued, with a Mark Returned
       action (an update, not a delete) on active loans. -->
  <div class="card">
    <h2>Books You've Issued</h2>
    <table>
      <thead><tr><th>Student</th><th>Book</th><th>Due</th><th>Status</th><th></th></tr></thead>
      <tbody id="issuedRows"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>
</main>

<script src="./js/firebaseConfig.js"></script>

<script type="module">
  import { guardPage } from './js/session-manager.js';
  guardPage({ loginUrl: '/login.html?reason=session-expired&redirect=' + encodeURIComponent(window.location.pathname) });
</script>

<script>
(function () {
  var LOGIN_URL = '/login.html';
  var NO_ACCESS_URL = '/no-access.html';
  var currentUid = null;

  document.getElementById('logoutBtn').addEventListener('click', function () {
    firebase.auth().signOut().finally(function () {
      window.location.href = LOGIN_URL + '?redirect=' + encodeURIComponent(window.location.pathname);
    });
  });

  function showMsg(text, kind) {
    var el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + kind;
  }

  firebase.auth().onAuthStateChanged(function (user) {
    if (!user) {
      window.location.replace(LOGIN_URL + '?redirect=' + encodeURIComponent(window.location.pathname));
      return;
    }
    // Broader gate than index.html's Librarian/Advancedadmin check: any
    // signed-in staff member with a non-disabled users/{uid} doc can issue
    // books here. If you have a specific Teacher role flag from roles.js,
    // swap the condition below to check that instead.
    firebase.firestore().collection('users').doc(user.uid).get()
      .then(function (snap) {
        var data = (snap.exists && snap.data()) || {};
        if (!snap.exists || data.disabled === true) {
          firebase.auth().signOut().finally(function () {
            window.location.replace(NO_ACCESS_URL);
          });
          return;
        }
        currentUid = user.uid;
        document.body.classList.remove('auth-pending');
        init();
      })
      .catch(function (err) {
        console.error('Access check failed:', err);
        window.location.replace(LOGIN_URL + '?reason=error');
      });
  });

  var db = firebase.database();

  function init() {
    var dueDate = document.getElementById('dueDate');
    var d = new Date();
    d.setDate(d.getDate() + 14);
    dueDate.value = d.toISOString().split('T')[0];

    populateGrades();
    populateBooks();
    loadMyIssuances();

    document.getElementById('gradeSelect').addEventListener('change', populateStudentsForGrade);
    document.getElementById('issueBtn').addEventListener('click', issueBook);
  }

  function populateGrades() {
    db.ref('students').once('value').then(function (snap) {
      var grades = {};
      snap.forEach(function (child) {
        var g = child.val().grade;
        if (g) grades[g] = true;
      });
      var select = document.getElementById('gradeSelect');
      Object.keys(grades).sort().forEach(function (g) {
        var opt = document.createElement('option');
        opt.value = g; opt.textContent = g;
        select.appendChild(opt);
      });
    });
  }

  function populateStudentsForGrade() {
    var grade = document.getElementById('gradeSelect').value;
    var select = document.getElementById('studentSelect');
    select.innerHTML = '<option value="">Select student</option>';
    if (!grade) { select.disabled = true; return; }
    db.ref('students').orderByChild('grade').equalTo(grade).once('value').then(function (snap) {
      if (!snap.exists()) {
        select.innerHTML = '<option value="">No students in this grade</option>';
        select.disabled = true;
        return;
      }
      snap.forEach(function (child) {
        var s = child.val();
        var opt = document.createElement('option');
        opt.value = child.key;
        opt.textContent = (s.name || s.fullName || 'Unnamed') + ' (' + (s.assessmentNo || 'No Assessment No') + ')';
        select.appendChild(opt);
      });
      select.disabled = false;
    });
  }

  function populateBooks() {
    var select = document.getElementById('bookSelect');
    select.innerHTML = '<option value="">Select book</option>';
    db.ref('books').once('value').then(function (snap) {
      snap.forEach(function (child) {
        var book = child.val();
        if (book.available > 0) {
          var opt = document.createElement('option');
          opt.value = child.key;
          opt.textContent = book.title + ' (' + book.available + ' available)';
          select.appendChild(opt);
        }
      });
    });
  }

  function issueBook() {
    var studentId = document.getElementById('studentSelect').value;
    var bookId = document.getElementById('bookSelect').value;
    var dueDate = document.getElementById('dueDate').value;
    var issueBtn = document.getElementById('issueBtn');

    if (!studentId || !bookId || !dueDate) {
      showMsg('Select a grade, student, book, and due date.', 'err');
      return;
    }

    issueBtn.disabled = true;
    Promise.all([
      db.ref('students/' + studentId).once('value'),
      db.ref('books/' + bookId).once('value')
    ]).then(function (results) {
      var student = results[0].val();
      var book = results[1].val();
      if (!student || !book) throw new Error('Invalid student or book selection.');
      if (!(book.available > 0)) throw new Error('That book is no longer available.');

      var issuanceData = {
        studentId: studentId,
        studentName: student.name || student.fullName || '',
        grade: student.grade || '',
        upi: student.upi || student.upiNo || '',
        bookId: bookId,
        bookTitle: book.title || '',
        issueDate: new Date().toISOString().split('T')[0],
        returnDate: dueDate,
        status: 'active',
        timestamp: Date.now(),
        issuedBy: currentUid,
        issuedByName: firebase.auth().currentUser.email || currentUid
      };

      return Promise.all([
        db.ref('issuance').push(issuanceData),
        db.ref().update({
          ['books/' + bookId + '/available']: book.available - 1,
          ['books/' + bookId + '/updatedAt']: Date.now()
        }),
        db.ref('activities').push({
          type: 'issue',
          bookId: bookId,
          studentId: studentId,
          description: 'Issued "' + book.title + '" to ' + issuanceData.studentName,
          timestamp: Date.now(),
          by: currentUid
        })
      ]);
    }).then(function () {
      showMsg('Book issued successfully.', 'ok');
      document.getElementById('studentSelect').value = '';
      document.getElementById('bookSelect').value = '';
      populateBooks();
      loadMyIssuances();
    }).catch(function (err) {
      console.error(err);
      showMsg(err.message || 'Failed to issue book.', 'err');
    }).finally(function () {
      issueBtn.disabled = false;
    });
  }

  // Mark Returned is the ONLY action available on an existing record here —
  // it updates the issuance status and restores book availability. There is
  // deliberately no delete/remove control on this page.
  function markReturned(issuanceId, bookId) {
    var issuanceRef = db.ref('issuance/' + issuanceId);
    issuanceRef.once('value').then(function (snap) {
      var issuance = snap.val();
      if (!issuance) throw new Error('Record not found.');
      return issuanceRef.update({
        status: 'returned',
        returnedDate: new Date().toISOString(),
        actualReturnDate: new Date().toISOString(),
        updatedAt: Date.now()
      }).then(function () {
        return db.ref('books/' + bookId).once('value');
      }).then(function (bookSnap) {
        var book = bookSnap.val();
        if (!book) return;
        return db.ref('books/' + bookId).update({
          available: (book.available || 0) + 1,
          updatedAt: Date.now()
        });
      }).then(function () {
        return db.ref('activities').push({
          type: 'return',
          bookId: bookId,
          studentId: issuance.studentId,
          description: 'Marked "' + (issuance.bookTitle || 'a book') + '" as returned',
          timestamp: Date.now(),
          by: currentUid
        });
      });
    }).then(function () {
      showMsg('Marked as returned.', 'ok');
      loadMyIssuances();
      populateBooks();
    }).catch(function (err) {
      console.error(err);
      showMsg(err.message || 'Failed to mark returned.', 'err');
    });
  }

  function loadMyIssuances() {
    var tbody = document.getElementById('issuedRows');
    db.ref('issuance').orderByChild('issuedBy').equalTo(currentUid).once('value').then(function (snap) {
      var rows = [];
      snap.forEach(function (child) {
        rows.push({ id: child.key, data: child.val() });
      });
      rows.sort(function (a, b) { return (b.data.timestamp || 0) - (a.data.timestamp || 0); });

      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty">You haven\'t issued any books yet.</td></tr>';
        return;
      }

      var now = new Date();
      tbody.innerHTML = rows.map(function (r) {
        var due = new Date(r.data.returnDate);
        var overdue = r.data.status === 'active' && due < now;
        var statusLabel = r.data.status === 'returned' ? 'Returned' : (overdue ? 'Overdue' : 'Active');
        var pillClass = r.data.status === 'returned' ? 'pill-active' : (overdue ? 'pill-overdue' : 'pill-active');
        var actionCell = r.data.status === 'active'
          ? '<button class="btn-return" data-id="' + r.id + '" data-book="' + r.data.bookId + '">Mark Returned</button>'
          : '';
        return '<tr>' +
          '<td>' + (r.data.studentName || '') + '</td>' +
          '<td>' + (r.data.bookTitle || '') + '</td>' +
          '<td>' + (r.data.returnDate || '') + '</td>' +
          '<td><span class="pill ' + pillClass + '">' + statusLabel + '</span></td>' +
          '<td>' + actionCell + '</td>' +
        '</tr>';
      }).join('');

      tbody.querySelectorAll('.btn-return').forEach(function (btn) {
        btn.addEventListener('click', function () {
          markReturned(btn.getAttribute('data-id'), btn.getAttribute('data-book'));
        });
      });
    });
  }
})();
</script>
</body>
</html>
